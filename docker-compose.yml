name: latchslot

services:
  postgres:
    # Major version bump? Migrate the data first — never point a new major at
    # an old volume. See docs/operations/postgres-major-upgrade.md.
    image: postgres:19-alpine
    environment:
      POSTGRES_USER: latchslot
      POSTGRES_PASSWORD: latchslot
      POSTGRES_DB: latchslot
    ports:
      - "5432:5432"
    volumes:
      # 18+ layout: data lands in /var/lib/postgresql/19, not at the mount root.
      # Do not mount a PG16 volume here; see docs/operations/postgres-major-upgrade.md.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U latchslot -d latchslot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    # Redis is a disposable projection, never the source of truth.
    # No AOF/RDB persistence on purpose: a wiped Redis is a test case,
    # and hydration must rebuild it from PostgreSQL.
    image: redis:8.10-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
